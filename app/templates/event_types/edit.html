{% extends "base.html" %}
{% block title %}Edit Event Type{% endblock %}
{% block content %}
<div class="container mt-4">
    <h1>Edit Event Type</h1>
    <form method="post" class="mt-3">
        <div class="mb-3">
            <label class="form-label" for="title">Title</label>
            <input type="text" class="form-control" id="title" name="title" value="{{ event_type.title }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="duration_minutes">Duration (minutes)</label>
            <input type="number" class="form-control" id="duration_minutes" name="duration_minutes" value="{{ event_type.duration_minutes }}" min="5" step="5">
        </div>
        <div class="mb-3">
            <label class="form-label" for="description">Description</label>
            <textarea class="form-control" id="description" name="description" rows="3">{{ event_type.description or '' }}</textarea>
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="is_public" name="is_public" {% if event_type.is_public %}checked{% endif %}>
            <label class="form-check-label" for="is_public">Public</label>
        </div>
        <button type="submit" class="btn btn-primary">Save changes</button>
        <a href="{{ url_for('event_types_routes.list_event_types') }}" class="btn btn-secondary ms-2">Cancel</a>
    </form>
</div>
{% endblock %}
