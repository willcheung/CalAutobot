<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #f44336;
            margin-bottom: 10px;
        }
        .message {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 6px;
            padding: 20px;
            margin: 20px 0;
        }
        .cta {
            text-align: center;
            margin: 30px 0;
        }
        .cta-button {
            display: inline-block;
            background: #3F51B5;
            color: white !important;
            padding: 14px 28px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 16px;
        }
        .benefits {
            background: #f8f9fa;
            border-radius: 6px;
            padding: 20px;
            margin: 20px 0;
        }
        .benefits h3 {
            color: #3F51B5;
            margin-top: 0;
        }
        .benefits ul {
            list-style: none;
            padding: 0;
        }
        .benefits li {
            padding: 8px 0;
        }
        .benefits li:before {
            content: "✓ ";
            color: #4caf50;
            font-weight: bold;
        }
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            text-align: center;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚠️ Email limit reached</h1>
    </div>

    <div class="message">
        <p><strong>You've reached the free trial limit of 2 emails to Cal@calautobot.com.</strong></p>
        <p>Cal Autobot is no longer accepting new customers as we prepare to retire the app.</p>
    </div>

    <div class="cta">
        <a href="https://vibecodingdad.com/#applied-ai" class="cta-button" style="color: white !important;">Explore my other builds →</a>
        <p>Or <a href="https://ai.meta.com/muse/">try Muse from Meta</a> as a personal AI assistant.</p>
    </div>

    <div class="footer">
        <p>
            Thank you for trying Cal Autobot.
        </p>
    </div>
</body>
</html>
