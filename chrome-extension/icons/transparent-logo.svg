<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Calendar body - transparent background with border -->
  <rect x="4" y="8" width="32" height="26" rx="4" fill="none" stroke="#4F46E5" stroke-width="2"/>
  
  <!-- Calendar header -->
  <rect x="4" y="8" width="32" height="6" rx="4" fill="#4F46E5"/>
  
  <!-- Calendar rings -->
  <circle cx="12" cy="4" r="1.5" fill="none" stroke="#6B7280" stroke-width="1"/>
  <circle cx="28" cy="4" r="1.5" fill="none" stroke="#6B7280" stroke-width="1"/>
  
  <!-- Calendar grid lines -->
  <line x1="8" y1="18" x2="32" y2="18" stroke="#E5E7EB" stroke-width="0.5"/>
  <line x1="8" y1="22" x2="32" y2="22" stroke="#E5E7EB" stroke-width="0.5"/>
  <line x1="8" y1="26" x2="32" y2="26" stroke="#E5E7EB" stroke-width="0.5"/>
  <line x1="12" y1="16" x2="12" y2="30" stroke="#E5E7EB" stroke-width="0.5"/>
  <line x1="16" y1="16" x2="16" y2="30" stroke="#E5E7EB" stroke-width="0.5"/>
  <line x1="20" y1="16" x2="20" y2="30" stroke="#E5E7EB" stroke-width="0.5"/>
  <line x1="24" y1="16" x2="24" y2="30" stroke="#E5E7EB" stroke-width="0.5"/>
  <line x1="28" y1="16" x2="28" y2="30" stroke="#E5E7EB" stroke-width="0.5"/>
  
  <!-- AI brain/circuit pattern -->
  <g opacity="0.9">
    <!-- Central node -->
    <circle cx="20" cy="22" r="1.5" fill="#F59E0B"/>
    
    <!-- Connected nodes -->
    <circle cx="16" cy="18" r="0.8" fill="#F59E0B"/>
    <circle cx="24" cy="18" r="0.8" fill="#F59E0B"/>
    <circle cx="16" cy="26" r="0.8" fill="#F59E0B"/>
    <circle cx="24" cy="26" r="0.8" fill="#F59E0B"/>
    
    <!-- Connections -->
    <line x1="20" y1="22" x2="16" y2="18" stroke="#F59E0B" stroke-width="0.8" opacity="0.7"/>
    <line x1="20" y1="22" x2="24" y2="18" stroke="#F59E0B" stroke-width="0.8" opacity="0.7"/>
    <line x1="20" y1="22" x2="16" y2="26" stroke="#F59E0B" stroke-width="0.8" opacity="0.7"/>
    <line x1="20" y1="22" x2="24" y2="26" stroke="#F59E0B" stroke-width="0.8" opacity="0.7"/>
  </g>
  
  <!-- Subtle sparkle effects -->
  <g opacity="0.8">
    <path d="M8 12 L9 13 L8 14 L7 13 Z" fill="#FCD34D"/>
    <path d="M32 20 L33 21 L32 22 L31 21 Z" fill="#FCD34D"/>
  </g>
</svg>